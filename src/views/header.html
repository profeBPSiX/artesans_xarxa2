<header
  class="
    sticky
    top-0
    z-[1000]
    border-b
    border-art-shadow
    font-sans
  "
>
  <nav
    class="
      min-h-[180px]
      bg-art-surface
    "
    aria-label="Navegació principal"
  >
    <div
      class="
        mx-auto
        flex
        min-h-[180px]
        max-w-7xl
        items-center
        justify-between
        px-20
      "
    >
      <a
        href="./index.html"
        class="
          inline-flex
          items-center
          transition
          hover:opacity-80
          focus:opacity-80
        "
        aria-label="Artesans en Xarxa - Inici"
      >
        <picture>
          <source
            srcset="./assets/images/header-logo.png?as=webp&width=300"
            type="image/webp"
          />

          <img
            src="./assets/images/header-logo.png?width=300"
            alt="Artesans en Xarxa"
            class="
              h-36
              w-auto
            "
          />
        </picture>
      </a>

      <button
        class="
          inline-flex
          items-center
          rounded-md
          border
          border-art-border-dark
          px-3
          py-2
          text-sm
          font-semibold
          text-art-text
          focus:outline-none
          focus:ring-[0.15rem]
          focus:ring-art-border-dark
          md:hidden
        "
        type="button"
        aria-label="Obrir o tancar el menú de navegació"
      >
        Menú
      </button>

      <ul
        class="
          hidden
          items-center
          gap-4
          md:flex
        "
      >
        <li>
          <a
            href="./index.html"
            class="
              text-[1.2rem]
              font-medium
              tracking-[0.03em]
              text-art-text
              transition
              hover:text-art-secondary
              focus:text-art-secondary
            "
          >
            Inici
          </a>
        </li>

        <li>
          <a
            href="./activitats.html"
            class="
              text-[1.2rem]
              font-medium
              tracking-[0.03em]
              text-art-text
              transition
              hover:text-art-secondary
              focus:text-art-secondary
            "
          >
            Activitats
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<!doctype html>

<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss" />

    <link rel="icon" type="image/png" href="./assets/images/icon-logo.png" />
    <title>Artesans en xarxa - Inici</title>
  </head>

  <body
    class="
      m-0
      flex
      min-h-screen
      flex-col
      bg-art-bg
      p-8
      font-sans
      text-base
      leading-6
      text-art-primary
    "
  >
    <include src="./views/header.html"></include>

    <main class="bg-art-bg">
      <section
        class="
          flex
          min-h-[calc(100dvh-160px)]
          flex-col
          gap-4
          px-4
          py-8
          text-center
          [container-name:poster]
          [container-type:inline-size]
          min-[900px]:grid
          min-[900px]:max-w-none
          min-[900px]:grid-cols-[minmax(2rem,0.5fr)_minmax(12rem,1.1fr)_minmax(10rem,0.7fr)_minmax(14rem,1fr)_minmax(4rem,0.4fr)]
          min-[900px]:grid-rows-[18vh_32vh_24vh_14vh]
          min-[900px]:p-0
        "
        aria-labelledby="poster-title"
      >
        <header
          class="
            bg-art-bg
            min-[900px]:relative
            min-[900px]:z-[2]
            min-[900px]:col-[3/6]
            min-[900px]:row-[1/3]
            min-[900px]:self-end
            min-[900px]:bg-art-bg-overlay
            min-[900px]:p-8
          "
        >
          <p
            class="
              text-[0.85rem]
              font-bold
              uppercase
              tracking-[0.08em]
              text-art-secondary
              min-[900px]:absolute
              min-[900px]:right-16
            "
          >
            Jornades d’artesania contemporània
          </p>

          <h1
            id="poster-title"
            class="
              m-0
              font-serif
              text-[clamp(3.5rem,12vw,9rem)]
              leading-[0.85]
              text-art-primary-dark
              max-[700px]:tracking-[-0.04em]
            "
          >
            Artesans en Xarxa
          </h1>

          <p
            class="
              mt-4
              text-[clamp(1.2rem,2vw,2rem)]
              text-art-secondary
            "
          >
            Connectant talent, compartint ofici.
          </p>
        </header>

        <div
          class="
            border-l-4
            border-art-secondary
            bg-art-bg
            pl-4
            max-[700px]:text-left
            min-[900px]:z-[3]
            min-[900px]:col-[2/3]
            min-[900px]:row-[3/4]
            min-[900px]:self-start
            min-[900px]:border-l-0
            min-[900px]:p-5
            min-[900px]:text-center
          "
        >
          <p
            class="
              mb-3
              text-[clamp(1.5rem,3vw,2rem)]
              font-bold
              text-art-primary-dark
            "
          >
            15–17 maig 2026
          </p>

          <p class="font-semibold uppercase text-art-text">
            Centre Cultural d'Encamp
          </p>
        </div>

        <div
          class="
            bg-art-bg
            min-[900px]:col-[1/4]
            min-[900px]:row-[1/4]
            min-[900px]:overflow-hidden
          "
        >
          <img
            class="
              block
              h-auto
              w-full
              object-cover
              min-[900px]:h-full
            "
            src="./assets/images/poster.png"
            alt="Interior d’un taller artesanal amb eines i peces fetes a mà"
          />
        </div>

        <div
          class="
            ml-8
            max-w-[38rem]
            bg-art-bg
            text-[clamp(1.1rem,2vw,1.6rem)]
            leading-[1.45]
            text-art-text
            max-[700px]:text-base
            max-[700px]:leading-[1.6]
            min-[900px]:z-[2]
            min-[900px]:col-[4/5]
            min-[900px]:row-[3/4]
            min-[900px]:border-t-[6px]
            min-[900px]:border-art-secondary
            min-[900px]:pt-6
          "
        >
          <p>
            Jornades dedicades a l’artesania contemporània, amb tallers,
            ponències i espais de connexió entre professionals del sector.
          </p>
        </div>
      </section>
    </main>

    <include src="./views/footer.html"></include>

    <script type="module" src="./assets/scripts/main.js"></script>
  </body>
</html>
